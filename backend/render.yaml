# Optional Render Blueprint (or copy env vars to an existing Web Service)
services:
  - type: web
    name: spec2test-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
